services:
  ai-twitterpersona:
    build: .
    container_name: ai_twitterpersona_dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8080
      - WEB_DEBUG=False
      - WORKERS=1
      # Keep the database and topic cache in the data volume
      - DB_NAME=/app/data/twitter.db
      - TOPIC_CACHE_FILE=/app/data/topic_cache.json
    volumes:
      # Writable: the settings page saves changes to token.env
      - ./token.env:/app/token.env
      # Named volumes: Docker would create missing bind-mount sources as root-owned
      # directories, which SQLite and the non-root app user cannot use
      - ai_twitterpersona_logs:/app/logs
      - ai_twitterpersona_data:/app/data
    networks:
      - ai-twitterpersona-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional reverse proxy. It needs ./nginx.conf and ./ssl/, which are not part of
  # the repository, so it only starts with: docker compose --profile nginx up -d
  nginx:
    image: nginx:alpine
    container_name: ai_twitterpersona_nginx
    restart: unless-stopped
    profiles: ["nginx"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - ai-twitterpersona
    networks:
      - ai-twitterpersona-network

networks:
  ai-twitterpersona-network:
    driver: bridge

volumes:
  ai_twitterpersona_data:
    driver: local
  ai_twitterpersona_logs:
    driver: local
